<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoonLit Hub</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121214;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #bb86fc;
            margin-bottom: 5px;
        }
        p.subtitle {
            color: #a0a0a5;
            margin-bottom: 30px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1000px;
        }
        .card {
            background-color: #1a1a1e;
            border: 2px solid #2a2a30;
            border-radius: 12px;
            overflow: hidden;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
        }
        .card:hover {
            transform: translateY(-5px);
            border-color: #bb86fc;
        }
        .card img {
            width: 100%;
            height: 140px;
            object-fit: cover;
            background-color: #252529;
        }
        .card p {
            margin: 0;
            padding: 12px;
            font-weight: bold;
            font-size: 14px;
        }
        /* Fullscreen Game Overlay Configuration */
        #game-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000000;
            z-index: 9999;
        }
        #game-frame {
            width: 100%;
            height: 100%;
            border: none;
        }
        #close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 10px 20px;
            background-color: #ff4757;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            z-index: 10000;
        }
    </style>
</head>
<body>

    <h1>MoonLit</h1>
    <p class="subtitle">Play, learn and unwind after dark.</p>
    
    <div class="grid" id="game-grid"></div>

    <!-- The built-in game screen container -->
    <div id="game-overlay">
        <button id="close-btn" onclick="closeGame()">Close Game</button>
        <iframe id="game-frame" src=""></iframe>
    </div>

    <script>
        // Updated game array using working public cloud deployment mirrors
        const games = [
            {name:"1v1.LOL",img:"icons/1v1.jpg",url:"1v1-lol/"},
{name:"2048",img:"icons/2048.jpg",url:"2048/"},
{name:"33 Maze",img:"icons/33-maze.jpg",url:"33-maze/"},
{name:"B-Cubed",img:"icons/b-cubed.jpg",url:"b-cubed/"},
{name:"Ball in the Hole",img:"icons/ball-in-the-hole.jpg",url:"ball-in-the-hole/"},
{name:"Braains.io",img:"icons/braains-io.jpg",url:"braains-io/"},
{name:"Build Royale",img:"icons/build-royale.jpg",url:"build-royale/"},
{name:"Castles.cc",img:"icons/castles-cc.jpg",url:"castles-cc/"},
{name:"Cavegame.io",img:"icons/cavegame-io.jpg",url:"cavegame-io/"},
{name:"Crossy Road",img:"icons/crossy-road.jpg",url:"crossy-road/"},
{name:"Deeeep.io",img:"icons/deeeep-io.jpg",url:"deeeep-io/"},
{name:"Devast.io",img:"icons/devast-io.jpg",url:"devast-io/"},
{name:"Flappy Bird",img:"icons/flappy-bird.jpg",url:"flappy-bird/"},
{name:"Frozen Tower",img:"icons/frozen-tower.jpg",url:"frozen-tower/"},
{name:"Geometry Dash",img:"icons/geometry-dash.jpg",url:"geometry-dash/"},
{name:"GoBattle.io",img:"icons/gobattle-io.jpg",url:"gobattle-io/"},
{name:"Gravity Dash",img:"icons/gravity-dash.jpg",url:"gravity-dash/"},
{name:"Gulper.io",img:"icons/gulper-io.jpg",url:"gulper-io/"},
{name:"Hole.io",img:"icons/hole-io.jpg",url:"hole-io/"},
{name:"Junon.io",img:"icons/junon-io.jpg",url:"junon-io/"},
{name:"Krew.io",img:"icons/krew-io.jpg",url:"krew-io/"},
{name:"Krunker.io",img:"icons/krunker-io.jpg",url:"krunker-io/"},
{name:"Lordz.io",img:"icons/lordz-io.jpg",url:"lordz-io/"},
{name:"Microgravity.io",img:"icons/microgravity-io.jpg",url:"microgravity-io/"},
{name:"MooMoo.io",img:"icons/moomoo-io.jpg",url:"moomoo-io/"},
{name:"Paper.io",img:"icons/paper-io.jpg",url:"paper-io/"},
{name:"Paper Minecraft",img:"icons/paper-minecraft.jpg",url:"paper-minecraft/"},
{name:"Royalz.io",img:"icons/royalz-io.jpg",url:"royalz-io/"},
{name:"shapez.io",img:"icons/shapez-io.jpg",url:"shapez-io/"},
{name:"Shell Shockers",img:"icons/shell-shockers.jpg",url:"shell-shockers/"},
{name:"Skribbl.io",img:"icons/skribbl-io.jpg",url:"skribbl-io/"},
{name:"Slope",img:"icons/slope.jpg",url:"slope/"},
{name:"Space Is Key",img:"icons/space-is-key.jpg",url:"space-is-key/"},
{name:"Splix.io",img:"icons/splix-io.jpg",url:"splix-io/"},
{name:"Squad Royale",img:"icons/squad-royale.jpg",url:"squad-royale/"},
{name:"Starve.io",img:"icons/starve-io.jpg",url:"starve-io/"},
{name:"Surviv.io",img:"icons/surviv-io.jpg",url:"surviv-io/"},
{name:"T-Rex Game",img:"icons/t-rex-game.jpg",url:"t-rex-game/"},
{name:"Takepoint.io",img:"icons/takepoint-io.jpg",url:"takepoint-io/"},
{name:"Trapz.io",img:"icons/trapz-io.jpg",url:"trapz-io/"},
{name:"Unblock Me",img:"icons/unblock-me.jpg",url:"unblock-me/"},
{name:"War Brokers",img:"icons/warbrokers-io.jpg",url:"warbrokers-io/"},
{name:"Warscrap.io",img:"icons/warscrap-io.jpg",url:"warscrap-io/"},
{name:"Witz.io",img:"icons/witz-io.jpg",url:"witz-io/"},
{name:"World's Hardest Game",img:"icons/worlds-hardest-game.jpg",url:"worlds-hardest-game/"},
{name:"Wormate.io",img:"icons/wormate-io.jpg",url:"wormate-io/"},
{name:"Zombs Royale",img:"icons/zombs-royale.jpg",url:"zombs-royale/"}
        ];

        const grid = document.getElementById('game-grid');
        const overlay = document.getElementById('game-overlay');
        const frame = document.getElementById('game-frame');

        // Dynamically build the interactive grid cards
        games.forEach(game => {
            const card = document.createElement('div');
            card.className = 'card';
            
            card.innerHTML = `
                <img src="${game.img}" alt="${game.name}" onerror="this.src='https://placehold.co{encodeURIComponent(game.name)}'">
                <p>${game.name}</p>
            `;

            // Open the iframe when clicked
            card.addEventListener('click', () => {
                frame.src = game.url;
                overlay.style.display = 'block';
            });

            grid.appendChild(card);
        });

        // Close the game container safely
        function closeGame() {
            overlay.style.display = 'none';
            frame.src = ''; // Stops game audio instantly when closing
        }
    </script>
</body>
</html>
